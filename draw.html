<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>سحب جوائز فرحتي 🎡</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#6d1f38;--wine-d:#42101f;--gold:#c9a24b;--gold-l:#e8d5a8;--rose:#b76e79;--cream:#fff8f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Tajawal',sans-serif;background:radial-gradient(circle at 50% 0%,#5c1c30,var(--wine-d) 70%);color:var(--cream);min-height:100vh;padding:20px 16px 60px;overflow-x:hidden}
.wrap{max-width:640px;margin:auto;text-align:center}
.logo{width:84px;height:84px;border-radius:50%;box-shadow:0 10px 26px rgba(0,0,0,.4);border:2px solid var(--gold)}
h1{font-family:'Aref Ruqaa',serif;font-size:clamp(30px,7vw,44px);color:var(--gold-l);margin:14px 0 4px;line-height:1.6}
.sub{color:rgba(255,248,246,.75);font-size:15px;margin-bottom:24px}

.panel{background:rgba(255,248,246,.06);border:1px solid rgba(201,162,75,.45);border-radius:22px;padding:20px;margin-bottom:22px;backdrop-filter:blur(8px)}
.panel label{display:block;text-align:right;color:var(--gold-l);font-weight:700;font-size:14.5px;margin-bottom:8px}
textarea{width:100%;min-height:110px;background:rgba(0,0,0,.25);border:1.5px solid rgba(201,162,75,.5);border-radius:14px;padding:12px 14px;color:#fff;font-family:inherit;font-size:15px;resize:vertical;outline:none;text-align:right}
textarea:focus{border-color:var(--gold)}
.count{color:var(--gold);font-size:13.5px;margin-top:6px;text-align:right}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.btn{border:none;border-radius:50px;padding:12px 26px;font-family:inherit;font-weight:800;font-size:15px;cursor:pointer;transition:.3s}
.btn-gold{background:linear-gradient(135deg,var(--gold),#e0c078);color:var(--wine-d);box-shadow:0 10px 24px rgba(201,162,75,.35)}
.btn-green{background:linear-gradient(135deg,#25d366,#128c7e);color:#fff;box-shadow:0 10px 24px rgba(18,140,126,.4);font-size:17px;padding:15px 44px}
.btn-ghost{background:rgba(255,255,255,.1);color:var(--gold-l);border:1.5px solid rgba(201,162,75,.6)}
.btn:hover{transform:translateY(-3px)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

.wheel-zone{position:relative;width:min(88vw,420px);margin:10px auto 26px}
.wheel-frame{position:relative;width:100%;aspect-ratio:1;border-radius:50%;border:8px solid var(--gold);box-shadow:0 0 0 6px var(--wine-d),0 0 50px rgba(201,162,75,.35),0 30px 70px rgba(0,0,0,.5);background:var(--wine-d)}
canvas{width:100%;height:100%;border-radius:50%;display:block}
.hub{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:70px;height:70px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#e0c078,var(--gold) 60%,#8a6a1f);box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 2px 6px rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:30px;z-index:3}
.pointer{position:absolute;top:-16px;left:50%;transform:translateX(-50%);width:0;height:0;border-right:16px solid transparent;border-left:16px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 4px 8px rgba(0,0,0,.5));z-index:4}
.lights{position:absolute;inset:-22px;border-radius:50%;pointer-events:none;animation:spin 24s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lights i{position:absolute;width:9px;height:9px;border-radius:50%;background:var(--gold-l);box-shadow:0 0 12px 3px rgba(232,213,168,.8)}
@keyframes flash{0%,100%{opacity:1}50%{opacity:.25}}
.winner-box{min-height:96px;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
.winner{font-family:'Aref Ruqaa',serif;font-size:clamp(30px,8vw,52px);color:var(--gold-l);text-shadow:0 0 30px rgba(201,162,75,.6);animation:pop .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.confetti{position:fixed;width:11px;height:11px;z-index:50;pointer-events:none;border-radius:2px}
.spinning canvas{transition:none!important}
.note{font-size:12.5px;color:rgba(255,248,246,.5);margin-top:18px}
</style>
</head>
<body>
<div class="wrap">
  <img src="logo-circle.png" alt="فرحتي" class="logo">
  <h1>🎡 سحب جوائز فرحتي</h1>
  <p class="sub">حظ أوفر للجميع 🍀</p>

  <div class="panel">
    <label>📋 أسماء المشاركين — اكتب كل اسم بسطر لحاله:</label>
    <textarea id="names" placeholder="اكتب الأسماء هيك:
أحمد الخطيب
سارة ناصر
محمد عودة
ليان حمدان"></textarea>
    <div class="count" id="cnt">عدد الأسماء: 0</div>
    <div class="row">
      <button class="btn btn-gold" onclick="saveNames()">💾 حفظ الأسماء</button>
      <button class="btn btn-ghost" onclick="resetAll()">🔄 تصفير وبدء جديد</button>
    </div>
  </div>

  <div class="winner-box" id="winnerBox"><span style="color:rgba(255,248,246,.5)">الفائز بيظهر هون 🏆</span></div>

  <div class="wheel-zone">
    <div class="lights" id="lights"></div>
    <div class="pointer"></div>
    <div class="wheel-frame"><canvas id="wheel"></canvas><div class="hub">🌹</div></div>
  </div>

  <button class="btn btn-green" id="spinBtn" onclick="spin()">🎡 لف الساحة!</button>
  <div class="row" style="margin-top:14px">
    <button class="btn btn-ghost" id="removeBtn" onclick="removeWinner()" style="display:none">✂️ إزالة الفائز والسحب التالي</button>
  </div>
  
</div>

<script>
const CV=document.getElementById('wheel'),CX=CV.getContext('2d');
const COLORS=['#6d1f38','#c9a24b','#b76e79','#42101f','#e8d5a8','#8e2f47'];
const SANS="'Tajawal',sans-serif";
let names=JSON.parse(localStorage.getItem('farhati_draw')||'[]');
let lastWinner=null, spinning=false;

document.getElementById('names').value=names.join('
');
updCount(); drawWheel(); buildLights();

function buildLights(){
  const L=document.getElementById('lights'); L.innerHTML='';
  for(let i=0;i<14;i++){
    const a=i/14*Math.PI*2, d=document.createElement('i');
    d.style.top=(50+47*Math.sin(a))+'%';
    d.style.left=(50+47*Math.cos(a))+'%';
    d.style.animation='flash '+(0.8+Math.random()*0.8)+'s infinite '+(Math.random())+'s';
    L.appendChild(d);
  }
}
function updCount(){document.getElementById('cnt').textContent='عدد الأسماء: '+names.length}

function parseNames(){
  return document.getElementById('names').value.split(/[
,،]+/).map(x=>x.trim()).filter(Boolean);
}
function saveNames(){
  names=parseNames();
  localStorage.setItem('farhati_draw',JSON.stringify(names));
  updCount(); drawWheel();
  if(names.length<2){alert('ضيف اسمين على الأقل!');return}
  alert('✅ تم حفظ '+names.length+' اسم');
}
function resetAll(){
  if(!confirm('بدك تمسح كل الأسماء والفائزين؟'))return;
  names=[];lastWinner=null;
  localStorage.removeItem('farhati_draw');
  document.getElementById('names').value='';
  document.getElementById('winnerBox').innerHTML='<span style="color:rgba(255,248,246,.5)">الفائز بيظهر هون 🏆</span>';
  document.getElementById('removeBtn').style.display='none';
  updCount();drawWheel();
}

function drawWheel(){
  const n=names.length||1;
  const size=640; CV.width=size;CV.height=size;
  const r=size/2,cx=r,cy=r;
  CX.clearRect(0,0,size,size);
  for(let i=0;i<n;i++){
    const a0=(i/n)*Math.PI*2-Math.PI/2, a1=((i+1)/n)*Math.PI*2-Math.PI/2;
    CX.beginPath();CX.moveTo(cx,cy);CX.arc(cx,cy,r-4,a0,a1);CX.closePath();
    CX.fillStyle=names.length?COLORS[i%COLORS.length]:'#3a1626';
    CX.fill();
    CX.strokeStyle='rgba(232,213,168,.7)';CX.lineWidth=2;CX.stroke();
    if(names.length){
      CX.save();
      CX.translate(cx,cy);CX.rotate((a0+a1)/2);
      CX.textAlign='right';CX.fillStyle=i%6===1||i%6===4?'#42101f':'#fff';
      let nm=names[i];
      if(nm.length>14)nm=nm.slice(0,13)+'…';
      CX.font='800 '+Math.min(30,Math.max(15,(r*1.5)/n))+'px '+SANS;
      CX.fillText(nm,r-26,8);
      CX.restore();
    }
  }
  if(!names.length){
    CX.fillStyle='rgba(255,248,246,.55)';CX.font='700 34px '+SANS;
    CX.textAlign='center';CX.fillText('أضف الأسماء أولاً 🌹',cx,cy-70);
  }
}

function spin(){
  if(spinning)return;
  if(names.length<2){alert('⚠️ لازم اسمين على الأقل — الصق الأسماء واضغط حفظ');return}
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  document.getElementById('winnerBox').innerHTML='<span style="color:var(--gold-l)">الساحة بتلف... 🎡</span>';
  document.getElementById('removeBtn').style.display='none';

  const win=Math.floor(Math.random()*names.length);
  const n=names.length;
  const seg=360/n;
  const targetMid=360-(win*seg+seg/2);
  const spins=5+Math.random()*2;
  const startRot=(parseFloat(CV.dataset.rot||0))%360;
  const finalRot=spins*360+targetMid;
  const dur=5200+Math.random()*1500;
  const t0=performance.now();

  function ease(t){return 1-Math.pow(1-t,4)}
  function frame(now){
    const p=Math.min(1,(now-t0)/dur);
    const rot=startRot+ease(p)*(finalRot-startRot);
    CV.style.transform='rotate('+rot+'deg)';
    CV.dataset.rot=rot;
    if(p<1){requestAnimationFrame(frame)}
    else{
      spinning=false;
      document.getElementById('spinBtn').disabled=false;
      lastWinner=names[win];
      document.getElementById('winnerBox').innerHTML='<div class="winner">🏆 '+lastWinner+'</div>';
      document.getElementById('removeBtn').style.display='inline-block';
      confetti();
    }
  }
  requestAnimationFrame(frame);
}

function removeWinner(){
  if(!lastWinner)return;
  names=names.filter(x=>x!==lastWinner);
  localStorage.setItem('farhati_draw',JSON.stringify(names));
  document.getElementById('names').value=names.join('
');
  updCount();drawWheel();
  document.getElementById('winnerBox').innerHTML='<span style="color:rgba(255,248,246,.5)">جاهزين للسحب التالي 🎡</span>';
  document.getElementById('removeBtn').style.display='none';
  lastWinner=null;
}

function confetti(){
  const colors=['#c9a24b','#e8d5a8','#b76e79','#25d366','#fff'];
  for(let i=0;i<70;i++){
    const c=document.createElement('div');
    c.className='confetti';
    c.style.background=colors[i%5];
    c.style.left=(38+Math.random()*24)+'%';
    c.style.top='46%';
    document.body.appendChild(c);
    const dx=(Math.random()-0.5)*window.innerWidth*0.9;
    const dy=-(80+Math.random()*320);
    c.animate([
      {transform:'translate(0,0) rotate(0)',opacity:1},
      {transform:'translate('+dx+'px,'+dy+'px) rotate('+(Math.random()*720-360)+'deg)',opacity:1,offset:.5},
      {transform:'translate('+dx*1.2+'px,'+(window.innerHeight*0.7)+'px) rotate('+(Math.random()*900)+'deg)',opacity:.4}
    ],{duration:2200+Math.random()*1200,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>c.remove();
  }
}
</script>
</body>
</html>
