<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختار أغنيتك | فرحتي</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--wine:#6d1f38;--wine-dark:#42101f;--rose:#b76e79;--gold:#c9a24b;--gold-light:#e8d5a8;--cream:#fff8f6;--ink:#3b2530;--muted:#8a6f78}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Tajawal',sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;line-height:1.8}
a{text-decoration:none;color:inherit}
.head{background:linear-gradient(160deg,var(--wine-dark),var(--wine));color:var(--gold-light);text-align:center;padding:44px 20px 34px}
.head img{width:76px;height:76px;border-radius:50%;box-shadow:0 8px 24px rgba(0,0,0,.35);margin-bottom:12px}
.head h1{font-family:'Aref Ruqaa',serif;font-size:clamp(26px,5vw,36px)}
.head p{opacity:.85;font-size:15px;margin-top:4px}
.wrap{max-width:860px;margin:0 auto;padding:26px 18px 70px}
.tabs{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:6px 0 26px}
.tab{border:2px solid var(--gold);background:#fff;color:var(--wine);padding:11px 26px;border-radius:50px;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;transition:.3s}
.tab.active{background:linear-gradient(135deg,var(--wine),var(--rose));color:#fff;border-color:var(--wine);box-shadow:0 10px 24px rgba(109,31,56,.28)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#fff;border:1px solid #f0e0d8;border-radius:20px;padding:20px;text-align:center;box-shadow:0 10px 28px rgba(109,31,56,.07);transition:.3s}
.card:hover{transform:translateY(-5px);box-shadow:0 18px 40px rgba(109,31,56,.14)}
.card .ic{font-size:34px;margin-bottom:8px}
.card h3{font-size:17px;color:var(--wine);margin-bottom:4px}
.card p{font-size:13px;color:var(--muted);margin-bottom:14px}
.row{display:flex;gap:8px;justify-content:center}
.btn{border:none;border-radius:50px;padding:9px 18px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:.3s}
.btn-play{background:var(--cream);color:var(--wine);border:1.5px solid var(--gold)}
.btn-use{background:linear-gradient(135deg,var(--wine),var(--rose));color:#fff;box-shadow:0 8px 20px rgba(109,31,56,.25)}
.btn:hover{transform:translateY(-2px)}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:26px}
.home-btn{position:fixed;top:16px;left:16px;z-index:150;background:rgba(255,255,255,.92);color:var(--wine);padding:9px 18px;border-radius:50px;font-weight:800;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.18);border:1.5px solid var(--gold)}
</style>
</head>
<body>
<a href="index.html" class="home-btn">🏠 الرئيسية</a>
<div class="head">
  <img src="logo-circle.png" alt="فرحتي">
  <h1>اختار أغنيتك 🎶</h1>
  <p>جرّب الأغنية واضغط "استخدام" — بتفتح صفحة الدعوة وأغنيتك شغالة عليها</p>
</div>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const LIB={
  zafaf:{label:"💍 زفاف",page:"zafaf.html",songs:[
    {f:"song-zafaf.mp3",n:"أغنية الزفاف ١"},
    {f:"song-zafaf1.mp3",n:"أغنية الزفاف ٢"},
    {f:"song-zafaf2.mp3",n:"أغنية الزفاف ٣"},
    {f:"song-zafaf3.mp3",n:"أغنية الزفاف ٤"},
    {f:"song-zafaf4.mp3",n:"أغنية الزفاف ٥"},
    {f:"song-zafaf5.mp3",n:"أغنية الزفاف ٦"},
    {f:"song-zafaf6.mp3",n:"أغنية الزفاف ٧"},
    {f:"song-zafaf7.mp3",n:"أغنية الزفاف ٨"},
  ]},
  henna:{label:"🌿 حنة",page:"henna.html",songs:[
    {f:"song-henna.mp3",n:"أغنية الحنة ١"},
    {f:"song-henna2.mp3",n:"أغنية الحنة ٢"},
    {f:"song-henna3.mp3",n:"أغنية الحنة ٣"},
    {f:"song-henna4.mp3",n:"أغنية الحنة ٤"},
    {f:"song-henna5.mp3",n:"أغنية الحنة ٥"},
  ]},
  khatba:{label:"💕 خطبة",page:"khatba.html",songs:[
    {f:"song-khatba.mp3",n:"أغنية الخطبة ١"},
  ]},
};

const tabsBox=document.getElementById('tabs');
const grid=document.getElementById('grid');
let cur='zafaf';
let player=null,playingBtn=null;

Object.keys(LIB).forEach(k=>{
  const b=document.createElement('button');
  b.className='tab'+(k===cur?' active':'');
  b.textContent=LIB[k].label;
  b.onclick=()=>{cur=k;document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');stopPlay();render();};
  tabsBox.appendChild(b);
});

function stopPlay(){if(player){player.pause();player=null}if(playingBtn){playingBtn.textContent='▶ تجربة';playingBtn=null}}

function render(){
  stopPlay();
  grid.innerHTML='';
  LIB[cur].songs.forEach(s=>{
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=`<div class="ic">🎵</div><h3>${s.n}</h3><p>${s.f}</p>
      <div class="row">
        <button class="btn btn-play">▶ تجربة</button>
        <a class="btn btn-use" href="${LIB[cur].page}?song=${encodeURIComponent(s.f)}">استخدام ✅</a>
      </div>`;
    const pb=c.querySelector('.btn-play');
    pb.onclick=()=>{
      if(playingBtn===pb){stopPlay();return}
      stopPlay();
      player=new Audio(s.f);
      player.play().catch(()=>{pb.textContent='❌ تعذر التشغيل';return});
      pb.textContent='⏸ إيقاف';
      playingBtn=pb;
      player.onended=stopPlay;
    };
    grid.appendChild(c);
  });
}
render();
</script>
</body>
</html>
